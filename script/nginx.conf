# Phase 27 — Nginx reverse proxy template cho production deploy.
#
# Operator setup:
#   1. Copy SSL cert vào `script/ssl/fullchain.pem` + `script/ssl/privkey.pem`
#      (Let's Encrypt qua certbot: `certbot --nginx -d screener.example.com`).
#   2. Replace `screener.example.com` bằng domain thực.
#   3. `docker compose up -d nginx` reload sau cert renewal.
#
# Behavior:
#   - 80 → 443 redirect (HSTS).
#   - 443 serve FE từ `frontend` service port 3000.
#   - 443 proxy `/api/*` + `/share/*` sang `backend` service port 8000.

server {
    listen 80;
    server_name screener.example.com;

    # ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name screener.example.com;

    # SSL — operator copy vào ./script/ssl/ before `docker compose up`.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — opt in chỉ khi cert ổn định.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body size — PDF upload + Telegram share JSON đủ <2MB; bump nếu future feature.
    client_max_body_size 4M;

    # Phase 27 — Backend API routes (/api/*) + public share view (/share/{token}/*)
    # qua reverse proxy. Backend service expose port 8000 nội bộ.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Next.js Image Optimization + static assets
    location /_next/ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
    }

    # All other routes → Next.js FE (App Router + dynamic /share/[token] page)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
