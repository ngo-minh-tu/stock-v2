[project]
name = "vn-re-screener-mvp"
version = "0.1.0"
description = "VN Real Estate AI Screener — backend MVP (FastAPI + SQLite)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "structlog>=24.1",
    "vnstock>=3.0",
    "weasyprint>=62.0",
    "python-telegram-bot>=21.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "feedparser>=6.0.12",
    "selectolax>=0.4.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q --strict-markers"
